version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_alpine
    restart: always
    init: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "54321:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - ecommerce_bridge

  kafka:
    image: bitnami/kafka:3.5.0
    container_name: kafka
    restart: unless-stopped
    init: true
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_NUM_PARTITIONS: "1"
      KAFKA_CFG_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"

      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - ecommerce_bridge

  redpanda_console:
    image: docker.redpanda.com/redpandadata/console:v2.2.5
    container_name: redpanda_console
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - ecommerce_bridge

  kafka-init:
    image: bitnami/kafka:3.5.0
    container_name: kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      "
      set -e;
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders_created --partitions 1 --replication-factor 1;
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments_approved --partitions 1 --replication-factor 1;
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic checkout_started --partitions 1 --replication-factor 1;
      echo 'Kafka topics ensured.';
      "
    networks:
      - ecommerce_bridge

  # Serviços NestJS (TypeScript)
  payments:
    build:
      context: ./payments
      dockerfile: ../build/Dockerfile
    container_name: svc_payments
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: development
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: payments
      KAFKA_GROUP_ID: payments-group
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      HEALTH_PATH: /
    ports:
      - "3004:3000"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_started
    networks:
      - ecommerce_bridge

  expeditions:
    build:
      context: ./expeditions
      dockerfile: ../build/Dockerfile
    container_name: svc_expeditions
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: development
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: expeditions
      KAFKA_GROUP_ID: expeditions-group
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      HEALTH_PATH: /
    ports:
      - "3003:3000"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_started
    networks:
      - ecommerce_bridge

  checkout:
    build:
      context: ./checkout
      dockerfile: ../build/Dockerfile
    container_name: svc_checkout
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: development
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: checkout
      KAFKA_GROUP_ID: checkout-group
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      HEALTH_PATH: /
    ports:
      - "3002:3000"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_started
    networks:
      - ecommerce_bridge
  ecommerce_bff:
    build:
      context: ./ecommerce_bff
      dockerfile: ../build/Dockerfile
    container_name: svc_ecommerce_bff
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: development
      PAYMENTS_URL: http://payments:3000
      EXPEDITIONS_URL: http://expeditions:3000
      CHECKOUT_URL: http://checkout:3000
      HEALTH_PATH: /
    ports:
      - "3001:3000"
    depends_on:
      payments:
        condition: service_healthy
      expeditions:
        condition: service_healthy
      checkout:
        condition: service_healthy
    networks:
      - ecommerce_bridge

volumes:
  postgres_data:
  kafka_data:

networks:
  ecommerce_bridge:
    driver: bridge
